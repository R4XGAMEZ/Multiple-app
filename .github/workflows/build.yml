name: Build MultiDroid APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Gradle wrapper
        run: |
          flutter create --org com.multidroid --project-name tempproject /tmp/tempproject
          cp -r /tmp/tempproject/android/gradle android/
          cp    /tmp/tempproject/android/gradlew android/
          cp    /tmp/tempproject/android/gradlew.bat android/
          chmod +x android/gradlew
          cp /tmp/tempproject/android/gradle.properties android/
          cp -rn /tmp/tempproject/android/app/src/main/res/. android/app/src/main/res/ 2>/dev/null || true

      - name: Build APK via flutter
        run: flutter build apk --release --no-tree-shake-icons
        continue-on-error: true

      - name: Build APK via Gradle directly (fallback)
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          cd android && ./gradlew assembleRelease \
            -Pflutter.sdk=$FLUTTER_ROOT \
            --no-daemon 2>&1 | tail -30
        continue-on-error: true

      - name: Find all APKs
        if: always()
        run: find . -name "*.apk" -type f | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: multidroid-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
