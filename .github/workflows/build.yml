name: Build MultiDroid APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate Gradle wrapper and resources
        run: |
          flutter create --org com.multidroid --project-name tempproject /tmp/tempproject
          cp -r /tmp/tempproject/android/gradle android/
          cp /tmp/tempproject/android/gradlew android/
          cp /tmp/tempproject/android/gradlew.bat android/
          chmod +x android/gradlew
          cp /tmp/tempproject/android/gradle.properties android/
          cp -rn /tmp/tempproject/android/app/src/main/res/. android/app/src/main/res/

      - name: Build APK
        run: flutter build apk --release --verbose 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: multidroid-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
